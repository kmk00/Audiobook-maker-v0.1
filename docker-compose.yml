services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: ab_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # 1. BACKEND API
  api:
    build:
      context: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - worker-omnivoice
      - worker-whisper

  # 4. WORKER OMNIVOICE
  worker-omnivoice:
    build:
      context: backend/workers/omnivoice
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./backend:/app
    command: python /app/workers/omnivoice/omnivoice_worker.py
  
  worker-whisper:
    build:
      context: backend/workers/whisper
    container_name: ab_whisper
    ports:
      - "8005:8000"
    volumes:
      - ./backend:/app
    environment:
      - WHISPER_MODEL_SIZE=medium
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python /app/workers/whisper/whisper_worker.py
    
volumes:
  sglang_workspace:
  sglang_hf_cache:
  sglang_uv_cache: