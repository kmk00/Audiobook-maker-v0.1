services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: ab_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # 1. BACKEND API
  api:
    build:
      context: backend
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - worker-omnivoice
      - worker-breeze
      - worker-whisper

  # 4. WORKER OMNIVOICE
  worker-omnivoice:
    build:
      context: backend/workers/omnivoice
    environment:
      - USER=appuser
      - LOGNAME=appuser
      - HOME=/tmp
      - TORCHINDUCTOR_CACHE_DIR=/tmp/torchinductor
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    user: "1000:1000"
    volumes:
      - ./backend:/app
    command: python /app/workers/omnivoice/omnivoice_worker.py
  
  # WORKER BREEZE TTS
  worker-breeze:
    build:
      context: backend/workers/breeze_tts
    volumes:
      - ./backend:/app
      - breeze_models:/models
    environment:
      - BREEZE_MODEL_DIR=/models/breeze-tts-2
      - USER=appuser
      - LOGNAME=appuser
      - HOME=/tmp
      - TORCHINDUCTOR_CACHE_DIR=/tmp/torchinductor
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    user: "1000:1000"
    command: python /app/workers/breeze_tts/breeze_worker.py

  worker-whisper:
    build:
      context: backend/workers/whisper
    container_name: ab_whisper
    user: "1000:1000"
    ports:
      - "8005:8000"
    volumes:
      - ./backend:/app
    environment:
      - WHISPER_MODEL_SIZE=large-v3
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: python /app/workers/whisper/whisper_worker.py
    
volumes:
  sglang_workspace:
  sglang_hf_cache:
  sglang_uv_cache:
  breeze_models: